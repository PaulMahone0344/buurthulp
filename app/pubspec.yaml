name: heitjehulp_app
description: "HeitjeHulp - buurthulp-app die ouderen koppelt aan gescreende jongeren."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Zelfde keuzes als ObyCom: Riverpod voor staat, go_router voor navigatie.
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  # M2: PocketBase-client verpakt in lib/core/pb (gateway), sessie-token in
  # secure storage, en de belknop naar de meldkamer in G8.
  pocketbase: ^0.24.0+1
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  # M3: foto, documentfoto en selfie (camera/galerij); verkleint zelf tot
  # max 1600 px lange zijde via maxWidth/maxHeight.
  image_picker: ^1.2.3
  # M3: http.MultipartFile voor foto-uploads naar PocketBase (en de
  # MockClient in de gateway-tests).
  http: ^1.6.0
  # M5: klussen op kaart (J12) met OpenStreetMap-tegels; geen sleutel, geen
  # kosten in de pilot (plan noemde google_maps_flutter, zie OPEN-PUNTEN-M5).
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # De drie fonts uit theme.dart, gebundeld zodat de app zonder internet
  # start. Bricolage Grotesque voor koppen (600/700), IBM Plex Sans voor
  # tekst (400-700), IBM Plex Mono voor labels (400/500).
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Tijdelijk icoon (3 okt): woordmerk "heitjehulp." op primair groen.
# Opnieuw maken: dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/icoon-1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#17453E"
  adaptive_icon_foreground: assets/icon/icoon-voorgrond-android.png
